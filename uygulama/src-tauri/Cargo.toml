[package]
name = "dunya-atlasi"
version = "0.1.0"
edition = "2021"
publish = false

# Windows programı `main.rs`'ten, Android uygulaması bu kütüphaneden açılır.
[lib]
name = "dunya_atlasi_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
# Google girişi sistem tarayıcısında (google.rs).
base64 = "0.22"
open = "5"
rand = "0.8"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "charset"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tokio = { version = "1", features = ["net", "io-util", "time", "macros", "rt-multi-thread", "sync"] }
url = "2"
# Bu bilgisayardaki yedek klasörü: Türkçe harfli dosya adları istek başlığında yüzde kodlu gelir.
percent-encoding = "2"

# Yalnız masaüstünde: yerel adres, tek pencere ve pencere hafızası (K34: yeri, boyutu, tam ekran olup olmadığı).
[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-localhost = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-window-state = "2"

# Tablette Google izni Chrome'da açılır (lib.rs `tarayicida_ac`).
[target.'cfg(any(target_os = "android", target_os = "ios"))'.dependencies]
tauri-plugin-opener = "2"

# Google yenileme anahtarı Windows'un parola kasasında (Kimlik Bilgisi Yöneticisi) saklanır (K31).
[target.'cfg(windows)'.dependencies]
keyring = { version = "3", features = ["windows-native"] }

[dev-dependencies]
# İzin listesinin (capabilities) yerel adresten gelen sayfaya Google isteklerini açtığını sınamak için.
tauri = { version = "2", features = ["test"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
