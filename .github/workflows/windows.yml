# Windows kurulum dosyası (TK6): Tauri kabuğuyla derlenir ve "windows" sürüm sayfasına
# "Dunya-Atlasi-kurulum.exe" adıyla konur. Bilgisayara yalnızca bu dosya indirilip çalıştırılır.
name: Windows uygulaması
on:
  push:
    branches: [main, 'claude/**']
    paths: ['uygulama/**', '.github/workflows/windows.yml']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: windows-${{ github.ref }}
  cancel-in-progress: true
jobs:
  derle:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: uygulama
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: uygulama/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: uygulama/src-tauri
      - run: npm ci
      - run: npx tauri build
      - name: Kurulum dosyasını adlandır
        shell: pwsh
        run: |
          $exe = Get-ChildItem src-tauri/target/release/bundle/nsis/*.exe | Select-Object -First 1
          Copy-Item $exe.FullName Dunya-Atlasi-kurulum.exe
      - uses: actions/upload-artifact@v4
        with:
          name: Dunya-Atlasi-kurulum
          path: uygulama/Dunya-Atlasi-kurulum.exe
      - name: Sürüm sayfasına koy
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $not = "Son derleme: ${{ github.sha }} (${{ github.ref_name }})"
          gh release view windows *> $null
          if ($LASTEXITCODE -ne 0) {
            gh release create windows --prerelease --title "Dünya Atlası (Windows)" --notes $not --target ${{ github.sha }}
          } else {
            gh release edit windows --notes $not
          }
          gh release upload windows Dunya-Atlasi-kurulum.exe --clobber
