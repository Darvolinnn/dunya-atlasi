# Her gönderimde ve birleştirme isteğinde: tür denetimi, bütün sınamalar ve derleme.
name: Denetim
on:
  push:
    branches: [main, 'paket/**']
  pull_request:
jobs:
  denetim:
    # Windows'ta dosya adlarında büyük-küçük harf ayrılmaz; içe aktarma çakışmaları yalnız orada görünür.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: uygulama
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: uygulama/package-lock.json
      - run: npm ci
      - run: npm run denetle
      - run: npm test
      - run: npm run build
